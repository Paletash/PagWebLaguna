                <p>

              </div>
              <a class="text-link" href="./metodologia.html">
                Ver fuentes y criterios

                  <path d="M5 12h14" />
                  <path d="m13 6 6 6-6 6" />

            <div class="sector-grid">

                      <rect x="14" y="14" width="7" height="7" rx="1" />
                    </svg>
                  </span>
                  <span class="sector-number">32.4% · 60 vacantes</span>
                </div>
                <span class="sector-tag">Mayor volumen</span>
                <h3>Diseño de sistemas de cómputo y servicios relacionados</h3>
                <p>Transformación digital, operaciones TI, CRM y desarrollo de producto.</p>
                <div class="sector-footer">
                  <span><i aria-hidden="true"></i> $28,879 MXN · 2.6 años</span>
                  <span class="sector-cta">Ver detalle →</span>
                </div>
              </button>

              <button type="button" class="sector-card sector-trigger" data-sector="comercio-telas">

                    </svg>
                  </span>

                </div>
                <span class="sector-tag">Mayor salario prom.</span>
                <h3>Comercio al por menor de telas</h3>
                <p>Alta demanda en growth marketing, analítica avanzada e IA aplicada.</p>
                <div class="sector-footer">
                  <span><i aria-hidden="true"></i> $47,750 MXN · 3.4 años</span>
                  <span class="sector-cta">Ver detalle →</span>

                    </svg>
                  </span>
                  <span class="sector-number">18.9% · 35 vacantes</span>
                </div>
                <span class="sector-tag">Mejor entrada junior</span>

                <p>Operación digital, marketplaces corporativos y crecimiento de canales.</p>
                <div class="sector-footer">
                  <span><i aria-hidden="true"></i> $32,724 MXN · 2.5 años</span>

                <span class="sector-tag">Enfoque estratégico</span>
                <h3>Servicios de consultoría en administración</h3>
                <p>Gestión de proyectos digitales, estrategia corporativa y adopción de IA.</p>
                <div class="sector-footer">
                  <span><i aria-hidden="true"></i> $37,414 MXN · 3.7 años</span>
                  <span class="sector-cta">Ver detalle →</span>

                <h3>Comercio al por menor de cosméticos y perfumería</h3>
                <p>Inteligencia de negocios, omnicanalidad, retail media y expansión B2B/B2C.</p>
                <div class="sector-footer">
                  <span><i aria-hidden="true"></i> $35,916 MXN · 3.5 años</span>
                  <span class="sector-cta">Ver detalle →</span>
                </div>
